{
  "schema_version": 1,
  "format_note": "This file uses the JSON subset of YAML 1.2 so the P0 harness has no PyYAML runtime dependency.",
  "plugins": [
    {
      "id": "framework-selftests",
      "path": "tests/selftests",
      "category": "harness",
      "profiles": ["quick", "refactor", "full-offline"],
      "command": ["{python}", "-m", "pytest", "-q", "tests/selftests"],
      "timeout_seconds": 60,
      "offline": true,
      "requires": ["pytest"],
      "enabled": true
    },
    {
      "id": "xiaotianwen-orchestrator",
      "path": "plugins/modified/astrbot_plugin_xiaotianwen_orchestrator/tests",
      "category": "modified",
