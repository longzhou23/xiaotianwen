      "timeout_seconds": 60,
      "offline": true,
      "requires": ["pytest"],
      "enabled": true
    },
    {
      "id": "astrbot-plugin-chatgpt-codex",
      "path": "plugins/modified/astrbot_plugin_chatgpt_codex/tests",
      "category": "modified",
      "profiles": ["refactor", "full-offline"],
      "command": ["{python}", "-m", "pytest", "-q", "plugins/modified/astrbot_plugin_chatgpt_codex/tests"],
      "timeout_seconds": 60,
      "offline": true,
      "requires": ["pytest", "tzdata"],
      "enabled": true
    },
    {
      "id": "astrbot-plugin-output-audit",
      "path": "plugins/modified/astrbot_plugin_output_audit/tests",
