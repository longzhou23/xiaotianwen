services:
  astrbot:
    image: ${ASTRBOT_IMAGE:-soulter/astrbot:latest}
    container_name: astrbot
    entrypoint: ["/bin/sh", "/AstrBot/data/plugin_page_compat.sh"]
    command: ["python", "main.py"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      # Codex CLI is installed under the persistent AstrBot data mount so it
      # survives container recreation.  Keep auth/config in CODEX_HOME rather
      # than baking credentials into the image or repository.
      CODEX_HOME: /AstrBot/data/codex/home
      PATH: /AstrBot/data/codex/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "${ASTRBOT_BIND_HOST:-0.0.0.0}:${ASTRBOT_DASHBOARD_PORT:-6200}:6200"
      - "${ASTRBOT_BIND_HOST:-0.0.0.0}:${ASTRBOT_ONEBOT_PORT:-8001}:8001"
    volumes:
      - ${ASTRBOT_DATA_DIR:-../../../runtime/astrobot/data}:/AstrBot/data
      - ./plugin_page_compat.sh:/AstrBot/data/plugin_page_compat.sh:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
