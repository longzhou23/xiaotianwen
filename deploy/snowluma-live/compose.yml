services:
  snowluma:
    image: ${SNOWLUMA_IMAGE:-motricseven7/snowluma:latest}
    container_name: snowluma
    restart: unless-stopped
    shm_size: 1gb
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      SNOWLUMA_UID: "1000"
      SNOWLUMA_GID: "1000"
      SNOWLUMA_WEBUI_HOST: 0.0.0.0
      SNOWLUMA_WEBUI_PORT: "5099"
      SNOWLUMA_LOG_LEVEL: info
      SNOWLUMA_HOOK_AUTOLOAD: "1"
      SNOWLUMA_QQ_FLAGS: "--disable-gpu --disable-software-rasterizer --disable-gpu-compositing"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6081:6081"
      - "127.0.0.1:5099:5099"
    volumes:
      - ./start-no-vnc-password.sh:/root/start.sh:ro
      - ${SNOWLUMA_DATA_DIR:-../../../runtime/snowluma/data}:/app/data
      - ${QQ_CONFIG_DIR:-../../../runtime/snowluma/qq-config}:/app/.config/QQ
      - ${QQ_DATA_DIR:-../../../runtime/snowluma/qq-data}:/app/.local/share
