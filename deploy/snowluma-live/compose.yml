services:
  snowluma:
    image: ${SNOWLUMA_IMAGE:-motricseven7/snowluma:latest}
    container_name: snowluma
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # The official image entrypoint runs non-executable commands through Node.
    # The bind-mounted compatibility script is intentionally invoked by Bash.
    command: ["bash", "/root/start.sh"]
    # Keep SnowLuma and AstrBot on a shared Docker network.  The OneBot
    # reverse-WebSocket client then uses the stable service name `astrbot`
    # instead of the host-gateway address (which can be unavailable when the
    # default docker0 bridge is down).
    networks:
      - default
      - astrbot
    shm_size: 1gb
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      SNOWLUMA_UID: "${SNOWLUMA_UID:-1000}"
      SNOWLUMA_GID: "${SNOWLUMA_GID:-1000}"
      SNOWLUMA_WEBUI_HOST: 0.0.0.0
      SNOWLUMA_WEBUI_PORT: "5099"
      SNOWLUMA_LOG_LEVEL: info
      SNOWLUMA_HOOK_AUTOLOAD: "1"
      SNOWLUMA_QQ_FLAGS: "--disable-gpu --disable-software-rasterizer --disable-gpu-compositing"
      TZ: Asia/Shanghai
    ports:
      - "${SNOWLUMA_BIND_HOST:-0.0.0.0}:6081:6081"
      - "${SNOWLUMA_BIND_HOST:-0.0.0.0}:5099:5099"
    volumes:
      - ./start-no-vnc-password.sh:/root/start.sh:ro
      - ${SNOWLUMA_DATA_DIR:-../../../runtime/snowluma/data}:/app/data
      - ${QQ_CONFIG_DIR:-../../../runtime/snowluma/qq-config}:/app/.config/QQ
      - ${QQ_DATA_DIR:-../../../runtime/snowluma/qq-data}:/app/.local/share
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

networks:
  astrbot:
    external: true
    name: xiaotianwen-astrbot_default
